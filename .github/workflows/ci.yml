name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Android and macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - run: bash scripts/build-all.sh
      - run: bash scripts/test.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: MouseBoard-Android
          path: dist/MouseBoard-Android.apk
          if-no-files-found: error
      - run: ditto -c -k --sequesterRsrc --keepParent dist/MouseBoard.app dist/MouseBoard-macOS.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: MouseBoard-macOS
          path: dist/MouseBoard-macOS.zip
          if-no-files-found: error

  windows:
    name: Windows companion
    needs: macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: "10.0.x"
          global-json-file: apps/windows/global.json
      - uses: actions/download-artifact@v8.0.2
        with:
          name: MouseBoard-Android
          path: dist
      - shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: MouseBoard-Windows-win-x64
          path: dist/MouseBoard-Windows-win-x64.zip
          if-no-files-found: error
